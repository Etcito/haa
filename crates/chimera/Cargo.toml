[package]
name = "chimera"
description = "CHIMERA physical-modelling voice engine (vendored subset of jamesondh/chimera-vocal-synth, MIT)"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
