[package]
name = "dizione"
description = "English text to tiny-voca phoneme tokens: a Rust port of dizione (n4ze3m/dizione, Apache-2.0)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
fancy-regex = "0.20"
regex = "1"
miniz_oxide = "0.8"
unicode-normalization = "0.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
