[package]
name = "haa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# CHIMERA physical-modelling voice engine (MIT). The `chimera` node wraps its speech and beatbox
# planners; vendored subset in crates/chimera (see its NOTICE.md).
chimera = { path = "../chimera" }
# Gzip CMUdict for the English text node: 869 kB instead of 3.3 MB in the wasm.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# tiny-voca speech (Apache-2.0 port): the `speak` node; the weights come from the host at run time.
tinyvoca = { path = "../tinyvoca" }
# Deterministic transcendentals for the emotion edits (voice_script), native and wasm alike.
libm = "=0.2.16"
# English text for the `speak` node (Apache-2.0 port of dizione): about 2.3 MB of a wasm module, so opt-in.
dizione = { path = "../dizione", optional = true }

[features]
dizione = ["dep:dizione"]
