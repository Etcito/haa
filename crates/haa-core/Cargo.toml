[package]
name = "haa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# CHIMERA physical-modelling voice engine (MIT). The `chimera` node wraps its speech and beatbox
# planners; vendored subset in crates/chimera (see its NOTICE.md).
chimera = { path = "../chimera" }
# Gzip CMUdict for the English text node: 869 kB instead of 3.3 MB in the wasm.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
