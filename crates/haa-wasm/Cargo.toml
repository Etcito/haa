[package]
name = "haa-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haa-core = { path = "../haa-core" }
haa-fit = { path = "../haa-fit" }
tinyvoca = { path = "../tinyvoca" }
dizione = { path = "../dizione", optional = true }
serde_json.workspace = true

[features]
# English text to tiny-voca tokens (src/dizione.rs): about 2.3 MB of the module (regex engines, Unicode tables, rules).
default = ["dizione"]
dizione = ["dep:dizione", "haa-core/dizione"]
